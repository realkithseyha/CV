<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banking CV Builder</title>
<meta name="color-scheme" content="light">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8; --surface:#fff; --ink:#18212B; --muted:#5B6673; --line:#E1E5EA;
  --navy:#1B3A5C; --navy-d:#12294400; --navy-h:#142C47; --focus:#2F6FB3; --danger:#B3261E;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 1.1rem/1.2 var(--serif);color:var(--navy);margin:0}
.brand small{display:block;font:400 .78rem var(--sans);color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px;transition:background .15s}
.btn:hover{background:var(--navy-h)}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:#EEF2F7}
.btn.small{padding:8px 12px;min-height:40px;font-size:.9rem}
.btn.danger{background:#fff;color:var(--danger);border-color:#E6C2BF}
.btn.danger:hover{background:#FBEFEE}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.tabs{display:none;max-width:1240px;margin:0 auto;padding:0 16px 12px}
.tabs div{display:flex;background:#EBEEF2;border-radius:10px;padding:4px;width:100%}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:10px;font-weight:600;color:var(--muted);cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:24px;align-items:start}

/* form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{font:700 1.15rem/1.3 var(--serif);color:var(--navy);margin:0 0 4px}
.card .hint{color:var(--muted);font-size:.88rem;margin:0 0 16px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 14px;border:1px solid #C9D0D8;border-radius:8px;background:#fff;font-size:16px;line-height:1.5;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--focus);}
.field textarea{resize:vertical;min-height:120px;display:block}
.field textarea.big{min-height:240px;line-height:1.65}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.entry{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:#FBFCFD}
.entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:600;color:var(--navy)}
.add{width:100%}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.saved{color:var(--muted);font-size:.85rem;margin:8px 2px 0}

/* CV paper */
.paper{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(20,40,70,.08);padding:clamp(22px,5vw,56px);color:#1A222C;max-width:820px;margin:0 auto;font-size:15px;line-height:1.6;overflow-wrap:anywhere}
.cv-head{border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:22px}
.cv-name{font:700 clamp(1.7rem,5vw,2.4rem)/1.15 var(--serif);color:var(--navy);margin:0}
.cv-role{font-size:1.1rem;font-weight:500;color:#3E4C5B;margin:4px 0 12px}
.cv-contact{display:flex;flex-wrap:wrap;gap:4px 0;font-size:.92rem;color:var(--muted);margin:0;padding:0;list-style:none}
.cv-contact li{padding-right:14px;margin-right:14px;border-right:1px solid #C9D0D8}
.cv-contact li:last-child{border:0;margin:0;padding:0}
.cv-sec{margin-bottom:22px}
.cv-sec h3{font:700 1.1rem/1.3 var(--serif);color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px}
.cv-sec p{margin:0;white-space:pre-line}
.job{margin-bottom:18px;break-inside:avoid}
.job:last-child{margin-bottom:0}
.job-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 16px}
.job-title{font-weight:600;font-size:1.02rem}
.job-date{color:var(--muted);font-size:.9rem}
.job-co{color:var(--navy);font-weight:500;margin-bottom:6px}
.job ul{margin:0;padding-left:20px}
.job li{margin-bottom:4px}
.job p{margin:0}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;margin:0;padding-left:20px}
.empty{color:var(--muted);font-style:italic}

/* responsive */
@media (max-width:959px){
  .tabs{display:block}
  .wrap{grid-template-columns:minmax(0,1fr);padding-top:16px}
  .pane-prev{display:none}
  body.view-prev .pane-edit{display:none}
  body.view-prev .pane-prev{display:block}
}
@media (max-width:520px){
  .row{grid-template-columns:1fr}
  .card{padding:16px}
  .skills{grid-template-columns:1fr}
  .brand small{display:none}
  .btn.print-top{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* print */
@page{size:A4;margin:14mm}
@media print{
  :root{padding:0}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.pane-edit,.tabs{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .pane-prev{display:block!important}
  .paper{border:0;box-shadow:none;padding:0;max-width:none;font-size:11pt}
  .cv-sec{break-inside:auto}
  .cv-sec h3{break-after:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand">Banking CV Builder<small>Fill in your details and download a clean CV</small></h1>
    <button class="btn print-top" id="printBtn" type="button">Save as PDF</button>
  </div>
  <nav class="tabs" aria-label="View"><div role="tablist">
    <button role="tab" id="tabEdit" aria-selected="true" type="button">Edit</button>
    <button role="tab" id="tabPrev" aria-selected="false" type="button">Preview</button>
  </div></nav>
</header>

<main class="wrap">
  <section class="pane-edit" aria-label="CV details">
    <form id="form" autocomplete="on" onsubmit="return false"></form>
  </section>
  <section class="pane-prev" aria-label="CV preview">
    <article class="paper" id="cv"></article>
  </section>
</main>

<script>
(function(){
  var KEY='banking-cv-builder-v2';
  var DEF={
    name:'Kith Seyha',title:'Senior Loan Officer',phone:'012 225 227',email:'kith.seyha@bankingmail.com',
    address:'Phnom Penh, Cambodia',link:'',
    summary:'Dedicated banking professional with over 5 years of experience in loan origination, retail banking and credit risk analysis. Proven record of growing client portfolios, ensuring regulatory compliance and driving financial service marketing to exceed branch targets.',
    jobs:[
      {title:'Senior Loan Officer',company:'Money Express Cambodia',dates:'Mar 2021 - Present',
       desc:'• Managed a corporate loan portfolio exceeding $5 million with a default rate below 1%.\n• Conducted credit risk assessments for high-net-worth clients and SME businesses.\n• Led local marketing that increased branch service subscriptions by 25% year on year.\n• Built strong client relationships and cross-sold exchange services and credit lines.'},
      {title:'Banking Service Associate',company:'National Bank Retail Branch',dates:'Jun 2018 - Feb 2021',
       desc:'• Processed daily transactions and handled client account inquiries.\n• Collected and verified documents for personal loan applications.\n• Promoted retail banking products directly to customers.'}
    ],
    edu:[{degree:'Bachelor of Business Administration in Finance',school:'Royal University of Phnom Penh',year:'2018'}],
    skills:'Credit Risk Analysis, Portfolio Management, Financial Marketing & Sales, Regulatory Compliance, Customer Relationship Management (CRM), Financial Forecasting',
    langs:'Khmer (Native), English (Professional)'
  };
  var BLANK={name:'',title:'',phone:'',email:'',address:'',link:'',summary:'',
    jobs:[{title:'',company:'',dates:'',desc:''}],edu:[{degree:'',school:'',year:''}],skills:'',langs:''};

  var S=load();
  var form=document.getElementById('form'), cv=document.getElementById('cv');

  function clone(o){return JSON.parse(JSON.stringify(o))}
  function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.jobs&&o.edu)return o}}catch(e){}return clone(DEF)}
  var savedEl;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(savedEl)savedEl.textContent='Saved on this device automatically.'}catch(e){if(savedEl)savedEl.textContent='Auto-save is unavailable in this browser.'}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S)}
  function set(p,v){var k=p.split('.'),o=S;for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}

  var uid=0;
  function field(p,label,o){
    o=o||{};var id='f'+(uid++),v=esc(get(p));
    var ctl=o.rows
      ? '<textarea id="'+id+'" data-p="'+p+'" class="'+(o.big?'big':'')+'" rows="'+o.rows+'" placeholder="'+esc(o.ph||'')+'">'+v+'</textarea>'
      : '<input id="'+id+'" data-p="'+p+'" type="'+(o.type||'text')+'" value="'+v+'" placeholder="'+esc(o.ph||'')+'"'+(o.ac?' autocomplete="'+o.ac+'"':'')+(o.im?' inputmode="'+o.im+'"':'')+'>';
    return '<div class="field"><label for="'+id+'">'+label+'</label>'+ctl+'</div>';
  }

  function buildForm(){
    uid=0;
    var h='';
    h+='<div class="card"><h2>Personal details</h2><p class="hint">Shown at the top of your CV.</p>'
      +field('name','Full name',{ac:'name'})
      +field('title','Target job title',{ph:'e.g. Senior Loan Officer'})
      +'<div class="row">'+field('phone','Phone',{type:'tel',ac:'tel',im:'tel'})+field('email','Email',{type:'email',ac:'email',im:'email'})+'</div>'
      +field('address','Location',{ac:'street-address',ph:'City, Country'})
      +field('link','LinkedIn or website (optional)',{type:'url',im:'url',ph:'linkedin.com/in/yourname'})
      +'</div>';
    h+='<div class="card"><h2>Professional summary</h2><p class="hint">Two to four sentences about your experience and strengths.</p>'
      +field('summary','Summary',{rows:6})+'</div>';
    h+='<div class="card"><h2>Work experience</h2><p class="hint">Put the most recent job first.</p>';
    S.jobs.forEach(function(j,i){
      h+='<div class="entry"><div class="entry-head"><span>Job '+(i+1)+'</span>'
        +(S.jobs.length>1?'<button type="button" class="btn danger small" data-del="jobs" data-i="'+i+'">Remove</button>':'')+'</div>'
        +field('jobs.'+i+'.title','Job title')
        +field('jobs.'+i+'.company','Company or bank')
        +field('jobs.'+i+'.dates','Dates',{ph:'e.g. Jan 2021 - Present'})
        +field('jobs.'+i+'.desc','Responsibilities and results',{rows:10,big:true,ph:'Write one achievement per line.\nExample: Managed a $5M loan portfolio with a default rate below 1%.'})
        +'<p class="hint" style="margin:6px 0 0">One point per line. Press Enter for a new bullet.</p></div>';
    });
    h+='<button type="button" class="btn ghost add" data-add="jobs">Add another job</button></div>';
    h+='<div class="card"><h2>Education</h2>';
    S.edu.forEach(function(e,i){
      h+='<div class="entry"><div class="entry-head"><span>Education '+(i+1)+'</span>'
        +(S.edu.length>1?'<button type="button" class="btn danger small" data-del="edu" data-i="'+i+'">Remove</button>':'')+'</div>'
        +field('edu.'+i+'.degree','Degree or certificate')
        +'<div class="row">'+field('edu.'+i+'.school','School or university')+field('edu.'+i+'.year','Year',{ph:'e.g. 2018'})+'</div></div>';
    });
    h+='<button type="button" class="btn ghost add" data-add="edu">Add education</button></div>';
    h+='<div class="card"><h2>Skills and languages</h2>'
      +field('skills','Core skills',{rows:5,ph:'Separate with commas'})
      +field('langs','Languages',{ph:'e.g. Khmer (Native), English (Professional)'})+'</div>';
    h+='<div class="foot"><button type="button" class="btn danger small" id="clearBtn">Clear all fields</button>'
      +'<button type="button" class="btn ghost small" id="sampleBtn">Restore sample</button></div>'
      +'<p class="saved" id="saved" role="status"></p>';
    form.innerHTML=h;
    savedEl=document.getElementById('saved');
    form.querySelectorAll('textarea').forEach(grow);
  }

  function grow(t){t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'}

  function bullets(text){
    var lines=String(text||'').split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
    if(!lines.length)return '';
    return '<ul>'+lines.map(function(l){return '<li>'+esc(l.replace(/^[•\-\*–·]\s*/,''))+'</li>'}).join('')+'</ul>';
  }
  function list(text){return String(text||'').split(/[,\n;]/).map(function(s){return s.trim()}).filter(Boolean)}

  function render(){
    var contact=[S.phone,S.email,S.address,S.link].filter(function(x){return x&&x.trim()});
    var h='<header class="cv-head"><h2 class="cv-name">'+esc(S.name||'Your name')+'</h2>'
      +(S.title?'<p class="cv-role">'+esc(S.title)+'</p>':'')
      +(contact.length?'<ul class="cv-contact">'+contact.map(function(c){return '<li>'+esc(c)+'</li>'}).join('')+'</ul>':'')+'</header>';
    if(S.summary&&S.summary.trim())h+='<section class="cv-sec"><h3>Professional summary</h3><p>'+esc(S.summary)+'</p></section>';
    var jobs=S.jobs.filter(function(j){return j.title||j.company||j.desc});
    if(jobs.length){
      h+='<section class="cv-sec"><h3>Work experience</h3>'+jobs.map(function(j){
        return '<div class="job"><div class="job-top"><span class="job-title">'+esc(j.title)+'</span><span class="job-date">'+esc(j.dates)+'</span></div>'
          +(j.company?'<div class="job-co">'+esc(j.company)+'</div>':'')+bullets(j.desc)+'</div>';
      }).join('')+'</section>';
    }
    var edu=S.edu.filter(function(e){return e.degree||e.school});
    if(edu.length){
      h+='<section class="cv-sec"><h3>Education</h3>'+edu.map(function(e){
        return '<div class="job"><div class="job-top"><span class="job-title">'+esc(e.degree)+'</span><span class="job-date">'+esc(e.year)+'</span></div>'
          +(e.school?'<div class="job-co" style="margin:0">'+esc(e.school)+'</div>':'')+'</div>';
      }).join('')+'</section>';
    }
    var sk=list(S.skills);
    if(sk.length)h+='<section class="cv-sec"><h3>Core skills</h3><ul class="skills">'+sk.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul></section>';
    var lg=list(S.langs);
    if(lg.length)h+='<section class="cv-sec"><h3>Languages</h3><p>'+lg.map(esc).join(', ')+'</p></section>';
    cv.innerHTML=h;
  }

  form.addEventListener('input',function(e){
    var p=e.target.getAttribute('data-p');if(!p)return;
    set(p,e.target.value);if(e.target.tagName==='TEXTAREA')grow(e.target);
    render();save();
  });
  form.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var add=b.getAttribute('data-add'),del=b.getAttribute('data-del');
    if(add==='jobs'){S.jobs.push({title:'',company:'',dates:'',desc:''});}
    else if(add==='edu'){S.edu.push({degree:'',school:'',year:''});}
    else if(del){S[del].splice(+b.getAttribute('data-i'),1);}
    else if(b.id==='clearBtn'){if(!confirm('Clear every field? This cannot be undone.'))return;S=clone(BLANK);}
    else if(b.id==='sampleBtn'){if(!confirm('Replace your details with the sample CV?'))return;S=clone(DEF);}
    else return;
    buildForm();render();save();
    if(add){var all=form.querySelectorAll('.entry');var last=all[all.length-1];if(last){var inp=form.querySelectorAll('[data-p^="'+add+'.'+(S[add].length-1)+'."]')[0];if(inp)inp.focus()}}
  });

  /* tabs (phone / tablet) */
  var tE=document.getElementById('tabEdit'),tP=document.getElementById('tabPrev');
  function view(prev){
    document.body.classList.toggle('view-prev',prev);
    tE.setAttribute('aria-selected',!prev);tP.setAttribute('aria-selected',prev);
    window.scrollTo(0,0);
  }
  tE.onclick=function(){view(false)};tP.onclick=function(){view(true)};

  document.getElementById('printBtn').onclick=function(){
    if(window.innerWidth<960&&!document.body.classList.contains('view-prev'))view(true);
    setTimeout(function(){window.print()},60);
  };

  buildForm();render();save();
})();
</script>
</body>
</html>
